<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Solid Black Background -->
  <rect width="800" height="800" fill="#000000" />

  <!-- Equilateral Mountains strictly ordered: Large (Back) -> Medium (Mid) -> Small (Front) -->
  <!-- Aligned at baseline y=600 (1/4 of total height from the bottom) -->
  <!-- Large (Furthest Back) (base: 440px) -->
  <polygon points="98.56,600.00 538.56,600.00 318.56,218.95" fill="#ffffff" stroke="#000000" stroke-width="8" stroke-linejoin="miter" stroke-miterlimit="4" />
  <!-- Medium (Middle Layer) (base: 265px) -->
  <polygon points="329.64,600.00 594.64,600.00 462.14,370.50" fill="#ffffff" stroke="#000000" stroke-width="8" stroke-linejoin="miter" stroke-miterlimit="4" />
  <!-- Small (Front-most) (base: 205px) -->
  <polygon points="490.38,600.00 695.38,600.00 592.88,422.46" fill="#ffffff" stroke="#000000" stroke-width="8" stroke-linejoin="miter" stroke-miterlimit="4" />
</svg>
